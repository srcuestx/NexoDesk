<ion-header>
  <ion-toolbar class="chatbot-header">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>
      <ion-icon name="chatbubble-outline" slot="start"></ion-icon>
      Asistente IA
    </ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="limpiarChat()">
        <ion-icon name="refresh-outline" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="chatbot-content">
  <div class="chat-container">

    <!-- Área de mensajes (scrollable) -->
    <div class="messages-area">
      <ion-list class="chat-list">
        <ion-item *ngFor="let mensaje of mensajes" [class.user-message]="mensaje.esUsuario" [class.bot-message]="!mensaje.esUsuario" lines="none">
          <ion-avatar slot="start" *ngIf="!mensaje.esUsuario">
            <div class="bot-avatar">🤖</div>
          </ion-avatar>
          <ion-label>
            <div class="message-bubble" [class.user-bubble]="mensaje.esUsuario" [class.bot-bubble]="!mensaje.esUsuario">
              <p>{{ mensaje.texto }}</p>
              <small>{{ mensaje.fecha | date:'h:mm a' }}</small>
            </div>
          </ion-label>
          <ion-avatar slot="end" *ngIf="mensaje.esUsuario">
            <div class="user-avatar">👤</div>
          </ion-avatar>
        </ion-item>

        <!-- Indicador de carga -->
        <ion-item *ngIf="isLoading" lines="none" class="bot-message">
          <ion-avatar slot="start">
            <div class="bot-avatar typing">🤖</div>
          </ion-avatar>
          <ion-label>
            <div class="message-bubble bot-bubble typing-indicator">
              <span></span><span></span><span></span>
            </div>
          </ion-label>
        </ion-item>
      </ion-list>

      <!-- Anchor para auto-scroll -->
      <div #messagesEnd></div>
    </div>

    <!-- Área inferior fija -->
    <div class="input-area">

      <!-- Acciones rápidas (solo al inicio) -->
      <div class="quick-actions" *ngIf="mensajes.length < 3">
        <ion-button fill="outline" size="small" (click)="nuevoMensaje = 'Mi computador está lento'; enviarMensaje()">
          💻 PC lento
        </ion-button>
        <ion-button fill="outline" size="small" (click)="nuevoMensaje = 'Internet no funciona'; enviarMensaje()">
          🌐 Internet
        </ion-button>
        <ion-button fill="outline" size="small" (click)="nuevoMensaje = '¿Cómo creo un ticket?'; enviarMensaje()">
          🎫 Crear ticket
        </ion-button>
        <ion-button fill="outline" size="small" (click)="nuevoMensaje = 'Necesito soporte urgente'; enviarMensaje()">
          🚨 Soporte urgente
        </ion-button>
      </div>

      <!-- Barra de entrada -->
      <div class="input-container">
        <ion-input
          [(ngModel)]="nuevoMensaje"
          placeholder="Escribe tu mensaje..."
          (keyup.enter)="enviarMensaje()"
          [disabled]="isLoading"
          class="chat-input"
        ></ion-input>
        <ion-button (click)="enviarMensaje()" [disabled]="!nuevoMensaje.trim() || isLoading" class="send-button">
          <ion-icon name="send-outline"></ion-icon>
        </ion-button>
      </div>
    </div>

  </div>
</ion-content>
