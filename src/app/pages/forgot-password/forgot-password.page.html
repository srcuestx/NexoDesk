<ion-header>
  <ion-toolbar class="forgot-header">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title>Recuperar Contraseña</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="forgot-content">
  <div class="forgot-container">
    
    <div class="icon-section">
      <ion-icon name="lock-open-outline" class="lock-icon"></ion-icon>
      <h2>¿Olvidaste tu contraseña?</h2>
      <p>Ingresa tu correo electrónico y te enviaremos un enlace para restablecerla.</p>
    </div>

    <ion-card class="forgot-card">
      <ion-card-content>
        
        <ion-item lines="none" class="input-item">
          <ion-icon name="mail-outline" slot="start" class="input-icon"></ion-icon>
          <ion-input
            type="email"
            placeholder="correo@ejemplo.com"
            [(ngModel)]="email"
            label="Email"
            labelPlacement="floating"
          ></ion-input>
        </ion-item>

        <ion-button expand="block" (click)="resetPassword()" class="reset-button" [disabled]="!email">
          <ion-icon name="send-outline" slot="start"></ion-icon>
          Enviar enlace de recuperación
        </ion-button>

        <div class="login-link">
          <a routerLink="/login">Volver a Iniciar Sesión</a>
        </div>

      </ion-card-content>
    </ion-card>

  </div>
</ion-content>
