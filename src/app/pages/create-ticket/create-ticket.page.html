<ion-header>
  <ion-toolbar class="create-header">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <ion-title>Crear Ticket</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="create-content">
  <ion-card class="form-card">
    <ion-card-content>
      
      <!-- Título -->
      <ion-item lines="none" class="input-item">
        <ion-label position="stacked">Título *</ion-label>
        <ion-input
          type="text"
          placeholder="Ej: No enciende mi computador"
          [(ngModel)]="title"
        ></ion-input>
      </ion-item>

      <!-- Prioridad -->
      <ion-item lines="none" class="input-item">
        <ion-label position="stacked">Prioridad</ion-label>
        <ion-select [(ngModel)]="priority" interface="action-sheet">
          <ion-select-option value="baja">🟢 Baja</ion-select-option>
          <ion-select-option value="media">🟡 Media</ion-select-option>
          <ion-select-option value="alta">🟠 Alta</ion-select-option>
          <ion-select-option value="urgente">🔴 Urgente</ion-select-option>
        </ion-select>
      </ion-item>

      <!-- Descripción -->
      <ion-item lines="none" class="input-item">
        <ion-label position="stacked">Descripción *</ion-label>
        <ion-textarea
          rows="6"
          placeholder="Describe detalladamente el problema..."
          [(ngModel)]="description"
        ></ion-textarea>
      </ion-item>

      <!-- Botón -->
      <ion-button 
        expand="block" 
        (click)="createTicket()"
        class="create-button"
      >
        <ion-icon name="save-outline" slot="start"></ion-icon>
        Crear Ticket
      </ion-button>

    </ion-card-content>
  </ion-card>
</ion-content>
